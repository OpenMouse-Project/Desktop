[package]
name = "openmouse-desktop"
version = "0.0.24"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openmouse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6.6"
anyhow = "1.0"
discord-rich-presence = "1.1.0"
sysinfo = "0.39.6"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# Bridge/Desktop cross-grade (src/cross_grade.rs): reqwest + tokio fetch the
# GitHub release manifest and stream down the sibling variant's installer;
# `open` hands the downloaded file to the OS's own installer/handler
# (ShellExecute / xdg-open) instead of us running it ourselves. All three
# are already pulled in transitively by tauri-plugin-updater and
# tauri-plugin-opener — these just make the version pin and usage explicit
# rather than relying on whatever a transitive dep happens to resolve to.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1", features = ["fs", "io-util"] }
open = "5.4.1"

