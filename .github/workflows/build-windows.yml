name: Build Windows

# Tauri can't cross-compile a Windows build from macOS — hidapi's native
# bindings, the MSVC linker, and WebView2 all have to happen on Windows
# itself. This sanity-checks compilation on every push to main. The real
# signed builds happen in release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Rust binary
        run: cargo build --release
        working-directory: src-tauri
