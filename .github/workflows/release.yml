name: Release

# Publishes a signed, auto-update-ready GitHub Release — separate from
# build-windows.yml, which just sanity-checks that every push to main still
# compiles. This is the one that actually feeds tauri.conf.json's updater
# endpoint (github.com/OpenMouse-Project/Desktop/releases/latest/download/latest.json):
# tauri-action signs the Windows installers with TAURI_SIGNING_PRIVATE_KEY
# (repo secret; the matching pubkey is what's baked into tauri.conf.json) and
# generates that latest.json alongside them. A second job builds the Linux
# .AppImage on ubuntu-latest so a tag also ships a distro-agnostic Linux
# build, and a final `publish` job flips the combined draft to a live release.
#
# `releases/latest` only ever resolves to the newest NON-prerelease,
# non-draft release — so this deliberately publishes as a real release
# (prerelease: false), even though the app's own titlebar still says
# "Beta." Those are unrelated: one's a GitHub API flag the updater endpoint
# depends on, the other's just a UI label.
#
# Bump tauri.conf.json's `version` before running this — tauri-action reads
# it to name both the release and its tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "OpenMouse Desktop v__VERSION__"
          releaseBody: "See Settings → Changelog in the app for details."
          releaseDraft: true
          prerelease: false

  # The Windows job above only produces the .msi/.exe installers. This job
  # builds the Linux .deb/.rpm/.AppImage so the same `v*.*.*` tag also
  # releases a distro-agnostic Linux build without anyone needing a local
  # Linux box. Both jobs run with releaseDraft: true and the same tagName —
  # tauri-action coalesces them onto one Release: the first leg to finish
  # creates the (draft) tag/release, the other leg uploads its artifacts to
  # it. The `publish` job below then flips the combined draft to a live
  # release once every leg is done.
  linux-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tauri.conf.json has a signing public key baked in (for the
          # Windows auto-updater), so Tauri insists on signing every bundle —
          # AppImage included — and fails without the private key. Same repo
          # secrets as the Windows job; the AppImage pickups an honest
          # signature alongside it, no extra cost.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "OpenMouse Desktop v__VERSION__"
          releaseBody: "See Settings → Changelog in the app for details."
          releaseDraft: true
          prerelease: false

  # Flipped the combined draft (built by both the Windows and Linux legs) to
  # a live, non-prerelease release — `releases/latest` only resolves to a
  # non-draft, non-prerelease release, so this is what lets the Windows
  # updater (and `releases/latest/download/latest.json`) resolve. Runs once
  # after every build leg, so the Windows + Linux artifacts all ship on the
  # same Release. Guarded so a manual `workflow_dispatch` with no matching
  # tag (which creates no release) doesn't fail the whole run.
  publish:
    runs-on: ubuntu-latest
    needs: [release, linux-appimage]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the draft release
        # Only meaningful on tag pushes: tauri-action coalesces all build-leg
        # artifacts onto one draft Release for the tag, then we flip it live.
        # Gate on the event type (deterministic) instead of probing the API:
        # `gh release view` on a draft returned non-zero in CI before, silently
        # skipping the publish while still exiting green. A manual
        # workflow_dispatch creates no release and just no-ops here.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Workflow dispatch: no release to publish. Skipping."
            exit 0
          fi
          echo "Publishing ${{ github.ref_name }}..."
          gh release edit "${{ github.ref_name }}" --draft=false
          echo "published=${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
