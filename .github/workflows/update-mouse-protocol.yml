name: Update Mouse Protocol

# Keeps @openmouse/protocol on the newest published release. The embedded
# driver bundle is rebuilt first, so a release that breaks the bundle is not
# committed. Mirrors the workflow in the openmouse web repo.
on:
  schedule:
    # Avoid the top of the hour, when scheduled workflows are most likely to queue.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-protocol-dependencies
  cancel-in-progress: false

jobs:
  update:
    # Windows, so the app's tests run as they do in build-gpui-windows.yml. The
    # push below uses the workflow token, which starts no other workflow.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install latest protocol release
        id: protocol
        shell: bash
        run: |
          set -euo pipefail

          current=$(node -p "require('./package.json').dependencies['@openmouse/protocol']")
          latest=$(npm view @openmouse/protocol version)

          if [[ "$current" == "$latest" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm install --save-exact "@openmouse/protocol@$latest"
          git diff --exit-code -- . \
            ':(exclude)package.json' \
            ':(exclude)package-lock.json'

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.protocol.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.protocol.outputs.changed == 'true'
        with:
          workspaces: gpui
          shared-key: windows

      - name: Build the embedded driver bundle
        if: steps.protocol.outputs.changed == 'true'
        run: node gpui/js/build.mjs

      - name: Test
        if: steps.protocol.outputs.changed == 'true'
        run: cargo test
        working-directory: gpui

      - name: Commit verified update
        if: steps.protocol.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.protocol.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(protocol): bump @openmouse/protocol to $VERSION"
          git push
